[project]
name = "pykachu-volleyball-env"
version = "0.0.2"
description = "Pikachu Volleyball RL environment and PPO agent"
authors = [
  { name = "Frog-Slayer", email = "pj0642@gmail.com" },
]
keywords = ["pikachu", "volleyball", "gym", "gymnasium", "reinforcement-learning", "ppo"]
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]

dependencies = [
  "gymnasium ~= 0.29.1",
  "numpy ~= 1.26.4",
  "pygame ~= 2.5.2",
  "torch >= 2.1, < 3.0",
  "tqdm >= 4.66, < 5.0",
]

[build-system]
requires = ["setuptools ~= 65.5.0"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/Frog-Slayer/Pykachu-Volleyball"
